<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <h1>Currency Converter</h1>
            <nav>
                <a href="index.html" class="active">Home</a>
                <a href="history.html">History</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="converter-container">
            <div id="error-message" class="error hidden"></div>
            
            <div class="form-group">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" value="10000" min="0.01" step="0.01">
            </div>

            <div class="currency-group">
                <div class="form-group">
                    <label for="from-currency">From:</label>
                    <select id="from-currency"></select>
                </div>

                <button type="button" id="swap-btn" class="icon-btn" title="Swap Currencies">⇄</button>

                <div class="form-group">
                    <label for="to-currency">To:</label>
                    <select id="to-currency"></select>
                </div>
            </div>

            <button id="convert-btn" class="primary-btn">Convert</button>

            <div id="result-container" class="result-container hidden">
                <h3>Converted amount:</h3>
                <p id="converted-amount" class="large-text"></p>
                <p>Exchange rate:</p>
                <p id="exchange-rate-text"></p>
                <p class="small-text">Last updated: <span id="last-updated"></span></p>
                
                <button id="save-favorite-btn" class="secondary-btn" style="margin-top: 15px;">Save as Favorite Pair</button>
            </div>
        </div>

        <div class="favorites-container">
            <h2>Favorite Currency Pairs</h2>
            <ul id="favorites-list">
                <!-- Favorites loaded here -->
            </ul>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
